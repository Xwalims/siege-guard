name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: the package has no dependencies, so there is nothing
      # to fetch and nothing to audit.
      - name: Run the test suite
        run: node --test
      - name: Run the attack demonstration
        run: node examples/attack-demo.js
      - name: The CLI must report a denial
        # GitHub Actions runs every `run:` block under `bash -e`, so a command
        # that exits non-zero aborts the step before the next line runs. The
        # capture has to be in the same statement as the command, or `simulate`
        # exiting 1 would kill the step and never be compared against anything.
        run: |
          code=0
          node bin/siege-guard.js simulate || code=$?
          echo "simulate exited with $code"
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from simulate, got $code"
            exit 1
          fi
      - name: Usage errors must exit 2
        run: |
          code=0
          node bin/siege-guard.js bogus || code=$?
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 from an unknown command, got $code"
            exit 1
          fi
          code=0
          node bin/siege-guard.js inspect --nonsense || code=$?
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 from an unknown option, got $code"
            exit 1
          fi

  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The IPv6 masking is checked against Python's ipaddress module rather
      # than against this repository's own expectations, because those
      # expectations were wrong twice while writing the tests.
      - name: Compare prefix handling with Python
        run: python3 scripts/cross-check.py